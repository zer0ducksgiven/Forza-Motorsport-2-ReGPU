name = "fm2-live"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Leaderboards (and later sessions): one D1 database. Local while developing:
# npx wrangler d1 execute fm2-live --local --file=schema.sql, then npx wrangler dev.
[[d1_databases]]
binding = "DB"
database_name = "fm2-live"
database_id = "4b54189d-a8af-49d4-a1c0-385ed61f6419"

# FM2 Live sessions (src/live_room.js): one Durable Object holds the players' WebSockets. SQLite-backed, which the
# free plan allows.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]
